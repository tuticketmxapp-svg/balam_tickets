<!-- Overlay -->
<div
  *ngIf="visible"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60">

  <!-- Modal -->
  <div
    class="relative w-full max-w-4xl mx-4 bg-white rounded-2xl shadow-xl overflow-y-auto max-h-[90vh]">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b">
      <h1 class="text-2xl font-bold text-center w-full">
        Regístrate
      </h1>

      <button
        class="absolute right-4 top-4 text-gray-500 hover:text-black text-2xl"
        (click)="closeModal()">
        ✕
      </button>
    </div>

    <!-- Body -->
    <div class="px-6 py-6">
      <p class="text-center text-gray-600 mb-6">
        Ingresa para ver tus eventos y administrar tu perfil.
      </p>

      <form [formGroup]="formulario" class="space-y-5">

        <!-- Nombre / Email -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Nombre completo</label>
            <input
              type="text"
              formControlName="name"
              [(ngModel)]="user.name"
              class="w-full rounded-lg border px-3 py-2 focus:ring-2 focus:ring-black focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input
              type="email"
              formControlName="email"
              [(ngModel)]="user.email"
              class="w-full rounded-lg border px-3 py-2 focus:ring-2 focus:ring-black focus:outline-none">
          </div>
        </div>

        <!-- Confirmar Email / Password -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Confirmar email</label>
            <input
              type="email"
              formControlName="email2"
              [(ngModel)]="user.email2"
              class="w-full rounded-lg border px-3 py-2 focus:ring-2 focus:ring-black focus:outline-none">

            <p
              class="text-sm text-red-500 mt-1"
              *ngIf="formulario.hasError('correosNoCoinciden')">
              Los correos no coinciden
            </p>
          </div>

          <div class="relative">
            <label class="block text-sm font-medium mb-1">Contraseña</label>
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              [(ngModel)]="user.password"
              class="w-full rounded-lg border px-3 py-2 pr-10 focus:ring-2 focus:ring-black focus:outline-none">

            <button
              type="button"
              class="absolute right-3 top-9 text-gray-500"
              (click)="togglePassword()">👁</button>
          </div>
        </div>

        <!-- Confirmar Password / País -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="relative">
            <label class="block text-sm font-medium mb-1">Confirmar contraseña</label>
            <input
              [type]="showPasswordConfirm ? 'text' : 'password'"
              formControlName="password_confirmation"
              [(ngModel)]="user.password_confirmation"
              class="w-full rounded-lg border px-3 py-2 pr-10 focus:ring-2 focus:ring-black focus:outline-none">

            <button
              type="button"
              class="absolute right-3 top-9 text-gray-500"
              (click)="togglePasswordConfirm()">👁</button>

            <p
              class="text-sm text-red-500 mt-1"
              *ngIf="formulario.hasError('passwordNoCoinciden')">
              Las contraseñas no coinciden
            </p>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">País</label>
            <select
              formControlName="country"
              [(ngModel)]="user.country"
              (change)="chanceCountry($event)"
              class="w-full rounded-lg border px-3 py-2 focus:ring-2 focus:ring-black focus:outline-none">
              <option *ngFor="let c of listCountries" [value]="c.name">
                {{ c.name }}
              </option>
            </select>
          </div>
        </div>

        <!-- Estado / Ciudad -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium mb-1">Estado</label>
            <select
              formControlName="state"
              [(ngModel)]="user.state"
              (change)="chanceStates($event)"
              class="w-full rounded-lg border px-3 py-2 focus:ring-2 focus:ring-black focus:outline-none">
              <option *ngFor="let s of listStates" [value]="s.name">
                {{ s.name }}
              </option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Ciudad</label>
            <select
              formControlName="city"
              [(ngModel)]="user.city"
              class="w-full rounded-lg border px-3 py-2 focus:ring-2 focus:ring-black focus:outline-none">
              <option *ngFor="let c of listCities" [value]="c.name">
                {{ c.name }}
              </option>
            </select>
          </div>
        </div>

        <!-- Botones -->
        <div class="pt-6 space-y-4">
          <button
            type="button"
            (click)="registro()"
            class="w-full rounded-lg bg-black text-white py-3 font-semibold hover:bg-gray-800 transition">
            Registrarse
          </button>

          <div class="flex items-center gap-3 text-gray-400">
            <hr class="flex-1">
            <span>o</span>
            <hr class="flex-1">
          </div>

          <button
            type="button"
            (click)="signInWithGoogle()"
            class="w-full flex items-center justify-center gap-2 border rounded-lg py-3 hover:bg-gray-100 transition">
            <img src="./assets/img/google.svg" class="w-5 h-5">
            Tu cuenta Google
          </button>
        </div>

      </form>
    </div>
  </div>
</div>

<div class="modal-header">
    <div class="col-xl-10 text-center">
        <h5>Código de Verificación</h5>
    </div>

    <button type="button" class="btn-close me-3" aria-label="Close" (click)="closeModal()">
        ×
    </button>
</div>

<div class="modal-body">
    <div class="row">
        <div class="col-lg-12 text-center">

            <h6>
                Ingrese el código de verificación enviado al correo
                <strong>{{ email }}</strong>
            </h6>

            <input type="text" class="form-control mt-3" placeholder="Código de verificación" [(ngModel)]="codigo">

            <button type="button" class="btn btn-link mt-2" (click)="envioCodigo()">
                Volver a enviar código
            </button>

        </div>
    </div>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="verificarDespues()">
        Verificar después
    </button>

    <button type="button" class="btn btn-primary" (click)="verificar()">
        Verificar
    </button>
</div>

<div class="flex items-center justify-center min-h-[80vh] px-4">
  <div
    class="w-full max-w-md p-8 space-y-8 bg-white/10 backdrop-blur-lg rounded-2xl border border-white/20 shadow-2xl">

    <!-- Header -->
    <div class="text-center">
      <h2 class="text-3xl font-bold mb-2">Bienvenido de nuevo</h2>
      <p class="text-gray-300">Ingresa a tu cuenta para continuar</p>
    </div>

    <!-- Form -->
    <form class="space-y-6" (ngSubmit)="login()" #loginForm="ngForm">

      <!-- Email -->
      <div>
        <label class="block mb-2 text-sm font-medium text-gray-400">
          Correo electrónico
        </label>
        <input
          type="email"
          name="email"
          [(ngModel)]="userLogin.email"
          required
          class="bg-white/5 border border-white/20 text-sm rounded-lg focus:ring-[#F27F1B] focus:border-[#F27F1B] block w-full p-3 placeholder-gray-400 backdrop-blur-sm transition-all duration-300 hover:bg-white/10"
          placeholder="nombre@empresa.com" />
      </div>

      <!-- Password -->
      <div>
        <label class="block mb-2 text-sm font-medium text-gray-400">
          Contraseña
        </label>
        <input
          type="password"
          name="password"
          [(ngModel)]="userLogin.password"
          required
          class="bg-white/5 border border-white/20 text-sm rounded-lg focus:ring-[#F27F1B] focus:border-[#F27F1B] block w-full p-3 placeholder-gray-400 backdrop-blur-sm transition-all duration-300 hover:bg-white/10"
          placeholder="••••••••" />
      </div>

      <!-- Forgot password -->
      <div class="flex items-center justify-end">
        <button
          type="button"
          (click)="forgetPassword()"
          class="text-sm font-medium text-orange-300 hover:text-orange-200 hover:underline">
          ¿Olvidaste tu contraseña?
        </button>
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full text-white bg-[#F27F1B] hover:bg-[#d87118] disabled:opacity-50 disabled:cursor-not-allowed focus:ring-4 focus:outline-none focus:ring-orange-800 font-medium rounded-lg text-sm px-5 py-3 text-center transition-all duration-300 transform hover:scale-[1.02] shadow-lg hover:shadow-orange-500/25">
        Iniciar Sesión
      </button>

      <!-- Divider -->
      <div class="flex items-center">
        <div class="w-full h-px bg-white/20"></div>
        <span class="px-4 text-sm text-gray-400">o</span>
        <div class="w-full h-px bg-white/20"></div>
      </div>

      <!-- Google Button -->
      <button
        type="button"
        (click)="signInWithGoogle()"
        class="w-full bg-white/5 hover:bg-white/10 focus:ring-4 focus:outline-none focus:ring-white/20 font-medium rounded-lg text-sm px-5 py-3 flex items-center justify-center gap-3 transition-all duration-300 border border-white/20 hover:border-white/30 backdrop-blur-sm">

        <!-- SVG Google -->
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>

        Continuar con Google
      </button>

      <!-- Register -->
      <div class="text-sm font-medium text-gray-300 text-center">
        ¿No tienes una cuenta?
        <a
          routerLink="/registro"
          class="text-orange-300 hover:text-orange-200 hover:underline ml-1">
          Regístrate aquí
        </a>
      </div>

    </form>
  </div>
</div>

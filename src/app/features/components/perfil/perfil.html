<div class="perfil-container">
  <h2 class="perfil-titulo">Mi Perfil</h2>
  <p class="perfil-subtitulo">Actualiza tu información personal y de seguridad.</p>

  <!-- Formulario para Información del Perfil -->
  <form class="form-seccion">
    <h3 class="seccion-titulo">Información Personal y Dirección</h3>

    <div class="form-row">
      <!-- Nombre Completo -->
      <div class="form-group">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" placeholder="Juan Pérez" required />
      </div>

      <!-- Fecha de Nacimiento -->
      <div class="form-group">
        <label for="dob">Fecha de nacimiento</label>
        <input type="date" id="dob" required />
      </div>
    </div>

    <div class="form-row">
      <!-- Teléfono -->
      <div class="form-group">
        <label for="phone">Teléfono</label>
        <input type="tel" id="phone" placeholder="+52 55 1234 5678" required />
      </div>

      <!-- Correo Electrónico (no editable) -->
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="nombre@ejemplo.com" disabled />
        <small>El correo electrónico no se puede modificar.</small>
      </div>
    </div>

    <!-- Dirección -->
    <div class="form-row">
      <div class="form-group">
        <label for="country">País</label>
        <input type="text" id="country" placeholder="México" required />
      </div>
      <div class="form-group">
        <label for="state">Estado</label>
        <input type="text" id="state" placeholder="CDMX" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="city">Ciudad</label>
        <input type="text" id="city" placeholder="Ciudad de México" required />
      </div>
      <div class="form-group">
        <label for="zip">Código Postal</label>
        <input type="text" id="zip" placeholder="01234" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group" style="flex: 2;">
        <label for="street">Calle</label>
        <input type="text" id="street" placeholder="Av. Reforma" required />
      </div>
      <div class="form-group" style="flex: 1;">
        <label for="number">Número</label>
        <input type="text" id="number" placeholder="123" required />
      </div>
    </div>

    <!-- Botón de Actualizar Perfil -->
    <button type="submit" class="submit-btn">Actualizar Perfil</button>
  </form>

  <!-- Formulario para Cambio de Contraseña -->
  <form class="form-seccion">
    <h3 class="seccion-titulo">Cambiar Contraseña</h3>

    <div class="form-group full-width">
      <label for="current-password">Contraseña Actual</label>
      <input type="password" id="current-password" placeholder="••••••••" required />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="new-password">Nueva Contraseña</label>
        <input type="password" id="new-password" placeholder="••••••••" required />
      </div>
      <div class="form-group">
        <label for="confirm-password">Confirmar Nueva Contraseña</label>
        <input type="password" id="confirm-password" placeholder="••••••••" required />
      </div>
    </div>

    <!-- Botón de Actualizar Contraseña -->
    <button type="submit" class="submit-btn">Actualizar Contraseña</button>
  </form>
</div>

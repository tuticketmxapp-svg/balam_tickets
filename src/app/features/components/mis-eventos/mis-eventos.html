<div class="mis-compras-container">
  <h2 class="titulo-seccion">Mis Compras</h2>

  <!-- Ejemplo de una compra (esto se puede iterar con @for) -->
  <div class="compra-card">
    <div class="card-imagen">
      <!-- La imagen debería ser dinámica -->
      <img src="https://via.placeholder.com/150x100" alt="Imagen del evento" />
    </div>
    <div class="card-info">
      <p class="numero-orden"><strong>Orden: #12345</strong></p>
      <p class="fecha-evento">Sábado 25 de Diciembre, 2025</p>
      <p class="lugar-evento">Foro Chiapas, Tuxtla Gutiérrez</p>
    </div>
    <div class="card-accion">
      <button class="descargar-btn">Descargar Boletos</button>
    </div>
  </div>

  <!-- Otro ejemplo de compra -->
  <div class="compra-card">
    <div class="card-imagen">
      <img src="https://via.placeholder.com/150x100" alt="Imagen del evento" />
    </div>
    <div class="card-info">
      <p class="numero-orden"><strong>Orden: #67890</strong></p>
      <p class="fecha-evento">Viernes 31 de Diciembre, 2025</p>
      <p class="lugar-evento">Palenque de la Feria, Comitán</p>
    </div>
    <div class="card-accion">
      <button class="descargar-btn">Descargar Boletos</button>
    </div>
  </div>
</div>
